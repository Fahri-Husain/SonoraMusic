name: Desktop Windows

# Dijalankan manual dari tab Actions. Tambahkan trigger lain nanti kalau perlu.
on:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 17 dipasang dulu, 25 terakhir: yang terakhir jadi JAVA_HOME dan dipakai menjalankan Gradle
      # (gradle-daemon-jvm.properties meminta JDK 25). JDK 17 dipakai khusus untuk jpackage.
      - name: Pasang JDK 17 dan 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Unduh libmpv (LGPL, non-v3)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo zhongfly/mpv-winbuild --pattern "mpv-dev-lgpl-x86_64-2*.7z" --dir mpv
          $archive = Get-ChildItem mpv -Filter *.7z | Select-Object -First 1
          New-Item -ItemType Directory -Force "desktopApp\resources\windows-x64" | Out-Null
          7z e $archive.FullName libmpv-2.dll "-odesktopApp\resources\windows-x64" -y
          $dll = Get-Item "desktopApp\resources\windows-x64\libmpv-2.dll"
          "{0}: {1:N1} MB" -f $archive.Name, ($dll.Length / 1MB)

      - name: Build installer (.msi dan .exe)
        shell: pwsh
        run: |
          $env:PACKAGING_JDK = $env:JAVA_HOME_17_X64
          ./gradlew :desktopApp:packageMsi :desktopApp:packageExe --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SonoraMusic-windows
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error